version: "3.9"

services:

  user-service:
    build: ./UserService
    container_name: user-service
    ports:
      - "5001:8080"
    networks:
      - taskmanager-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  notification-service:
    build: ./NotificationService
    container_name: notification-service
    ports:
      - "5003:8080"
    networks:
      - taskmanager-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  task-service:
    build: ./TaskService
    container_name: task-service
    ports:
      - "5002:8080"
    environment:
      # Container-to-container communication uses the Compose service name as hostname
      - Services__UserService=http://user-service:8080
      - Services__NotificationService=http://notification-service:8080
    depends_on:
      user-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    networks:
      - taskmanager-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  taskmanager-net:
    driver: bridge
